name: Agent Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-prod-deploy.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-agent-prod
  cancel-in-progress: true

jobs:
  agent-prod-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache agent dependencies
        uses: actions/cache@v4
        with:
          path: apps/agent/node_modules
          key: ${{ runner.os }}-agent-prod-deps-${{ hashFiles('apps/agent/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-agent-prod-deps-

      - name: Install agent dependencies
        run: |
          rm -f package.json package-lock.json
          cd apps/agent
          npm install

      - name: Copy .env.vault to agent directory
        run: cp .env.vault apps/agent/

      - name: Configure AWS Credentials and Environment
        working-directory: apps/agent
        env:
          DOTENV_KEY: ${{ secrets.PROD_DOTENV_KEY }}
        run: |
          node -r dotenv/config ./prepare-env.js production

      - name: Deploy to Production
        working-directory: apps/agent
        run: npm run deploy:prod 