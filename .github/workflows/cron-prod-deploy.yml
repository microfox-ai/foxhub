name: Cron Service Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "apps/cron/**"
      - "cron.prod.json"
      - ".github/workflows/cron-prod-deploy.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-cron-prod
  cancel-in-progress: true

jobs:
  cron-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/cron/node_modules
            apps/cron/dist
          key: ${{ runner.os }}-cron-${{ hashFiles('apps/cron/package-lock.json') }}-${{ hashFiles('apps/cron/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-cron-${{ hashFiles('apps/cron/package-lock.json') }}-

      - name: Install cron service dependencies
        id: install
        run: |
          # Remove root package.json to prevent npm from installing root dependencies
          # that require database environment variables
          rm -f package.json package-lock.json
          cd apps/cron
          if ! npm install; then
            echo "install-status=0" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "install-status=1" >> $GITHUB_OUTPUT

      - name: Build cron service
        id: build
        run: |
          if ${{steps.install.outputs.install-status == 0}} ; then
            echo "npm install failed"
            echo "build-status=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          cd apps/cron
          if ! npm run build; then
            echo "build-status=0" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "build-status=1" >> $GITHUB_OUTPUT

      - name: Prepare cron deployment files
        if: ${{steps.build.outputs.build-status == 1 }}
        run: |
          mkdir -p build/cron-prod/main-copy/apps/web
          cp -r apps/cron/dist build/cron-prod/main-copy/
          cp -r apps/cron/package*.json build/cron-prod/main-copy/
          cp -r apps/cron/node_modules build/cron-prod/main-copy/
          cp cron.prod.json build/cron-prod/main-copy/cron.json
          cp apps/web/vercel.json build/cron-prod/main-copy/apps/web/vercel.json
          
      - name: Upload cron service using rsync
        if: ${{steps.build.outputs.build-status == 1 }}
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: "-av --delete --partial --bwlimit=5000"
          path: "build/cron-prod/main-copy/"
          remote_path: "/home/${{ secrets.DROPLET_USER }}/foxhub/builds/cron-prod/main-copy"
          remote_host: ${{ secrets.DROPLET_IP }}
          remote_user: ${{ secrets.DROPLET_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up SSH (secured)
        if: ${{steps.build.outputs.build-status == 1 }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Deploy cron service on DigitalOcean
        if: ${{steps.build.outputs.build-status == 1 }}
        id: deploy
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} << 'ENDSSH'
            source ~/.nvm/nvm.sh
            nvm use 23
            
            BASE_PATH="/home/${{ secrets.DROPLET_USER }}/foxhub/builds/cron-prod"
            MAIN_PATH="$BASE_PATH/main"
            COPY_PATH="$BASE_PATH/main-copy"
            BACKUP_PATH="$BASE_PATH/main-backup"
            
            # Create backup of current cron build if it exists
            if [ -d "$MAIN_PATH" ]; then
              rm -rf "$BACKUP_PATH"
              cp -r "$MAIN_PATH" "$BACKUP_PATH"
            fi
            
            # Copy new build from main-copy to main
            rm -rf "$MAIN_PATH"
            cp -r "$COPY_PATH" "$MAIN_PATH"
            
            cd "$MAIN_PATH"
            
            export NODE_ENV=production
            export PORT=8002

            # Check if the cron process exists
            if pm2 list | grep -q "foxhub-cron-prod" ; then
              # Restart the existing process
              if ! pm2 restart "foxhub-cron-prod" --update-env ; then
                echo "Failed to restart PM2 cron process"
                exit 1
              fi
            else
              # First time deployment
              if ! pm2 start npm --name "foxhub-cron-prod" -- start ; then
                echo "Failed to start PM2 cron process"
                exit 1
              fi
            fi
            
            if ! pm2 show "foxhub-cron-prod" > /dev/null 2>&1; then
              echo "Failed to start/restart PM2 cron process"
              exit 1
            fi
            echo "Successfully deployed cron service"
          ENDSSH
          if [ $? -ne 0 ]; then
            echo "Cron deployment step failed"
            exit 1
          fi
