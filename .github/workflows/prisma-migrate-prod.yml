name: Production Prisma Migrations

# Split out of prod-deploy.yml when deployments moved to Vercel, which does not run migrations.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/prisma/**"
      - ".github/workflows/prisma-migrate-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-prisma-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Apply Prisma Migrations
        env:
          DOTENV_KEY: ${{ secrets.PROD_DOTENV_KEY }}
        run: npm run prisma:migrate-deploy
