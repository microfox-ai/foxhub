service: foxhub-agent

plugins:
  - serverless-plugin-typescript
  - serverless-api-gateway-throttling

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, env:STAGE, 'dev'}
  environment: ${file(env.json)}
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
      Resource:
        - Fn::GetAtt: [AgentQueue, Arn]

custom:
  apiGatewayThrottling:
    maxRequestsPerSecond: 50
    maxConcurrentRequests: 20

functions:
  unifiedHandler:
    handler: dist/index.handler
    events:
      - http:
          path: /
          method: any
          cors: true
  initiateTask:
    handler: dist/tasks/initiate.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - AgentQueue
              - Arn
          # Optional
          # batchSize: 10
          # Optional, minimum is 0 and the maximum is 300 (seconds)
          # maximumBatchingWindow: 10

resources:
  Resources:
    AgentQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: foxhub-agent-${self:provider.stage}-agent-queue

outputs:
  AgentQueueUrl:
    Description: "URL of the Agent SQS Queue"
    Value:
      Ref: AgentQueue
  AgentQueueArn:
    Description: "ARN of the Agent SQS Queue"
    Value:
      Fn::GetAtt:
        - AgentQueue
        - Arn
  ApiEndpoints:
    Description: "API Endpoints"
    Value:
      Fn::Join:
        - ""
        - - "API: https://"
          - Ref: "ApiGatewayRestApi"
          - ".execute-api."
          - Ref: "AWS::Region"
          - "/"
          - ${self:provider.stage}
