service: template-function-plain
package:
  exclude:
    - venv/**
    - src/**
    - node_modules/serverless-offline/**
# Configuration
custom:
  # Get environment from env or default to dev
  stage: ${env:ENVIRONMENT, 'dev'}
  serverless-offline:
    httpPort: 4000
    lambdaPort: 4002
    useChildProcesses: true
    useWorkerThreads: true
    noCookieValidation: true
    allowCache: true
    hideStackTraces: false
    disableCookieValidation: true
    noTimeout: true
    environment: ${file(env.json)}

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${env:ENVIRONMENT, 'dev'}
  environment: ${file(env.json)}

plugins:
  - serverless-plugin-typescript
  - serverless-offline

functions:
  # External API Endpoints
  getExternalData:
    handler: dist/getExternalData.getExternalDataFunction
    events:
      - http:
          path: /external
          method: get
          cors: true

  postExternalData:
    handler: dist/postExternalData.postExternalDataFunction
    events:
      - http:
          path: /external
          method: post
          cors: true

  # Cron Jobs
  dailyMorningJob:
    handler: dist/dailyMorningJob.dailyMorningJobFunction
    events:
      # HTTP endpoint for testing in all environments
      - http:
          path: /cron/daily-morning
          method: post
          cors: true
      - schedule:
          rate: cron(0 8 * * ? *)
          input:
            environment: ${env:ENVIRONMENT, 'dev'}
            source: scheduled-job

  # Documentation
  getDocs:
    handler: dist/index.getDocs
    events:
      - http:
          path: /docs.json
          method: get
          cors: true

# Resources for API Gateway
resources:
  Outputs:
    ApiEndpoints:
      Description: "API Endpoints"
      Value:
        Fn::Join:
          - ""
          - - "API: https://"
            - Ref: "ApiGatewayRestApi"
            - ".execute-api."
            - Ref: "AWS::Region"
            - ".amazonaws.com/${env:ENVIRONMENT, 'dev'}"
