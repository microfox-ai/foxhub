service: template-function

# Configuration
custom:
  # Get environment from env or default to dev
  stage: ${env:ENVIRONMENT, 'dev'}
  # HTTP port for offline mode
  serverless-offline:
    httpPort: 4000
  # Webpack configuration
  webpack:
    webpackConfig: webpack.config.js
    packager: 'npm'
    includeModules: true

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${env:ENVIRONMENT, 'dev'}
  environment:
    STAGE: ${env:ENVIRONMENT, 'dev'}
    # Set NODE_ENV based on environment
    NODE_ENV: ${env:NODE_ENV, 'development'}
    DATABASE_URL: ${env:DATABASE_URL}

    # Insert functions here
functions:


getDocs:
handler: dist/index.getDocs
events:
  - http:
      path: /docs.json
      method: get
      cors: true

# Resources for API Gateway
resources:
Outputs:
ApiEndpoints:
  Description: "API Endpoints"
  Value:
    Fn::Join:
      - ""
      - - "API: https://"
        - Ref: "ApiGatewayRestApi"
        - ".execute-api."
        - Ref: "AWS::Region"
        - ".amazonaws.com/${env:ENVIRONMENT, 'dev'}