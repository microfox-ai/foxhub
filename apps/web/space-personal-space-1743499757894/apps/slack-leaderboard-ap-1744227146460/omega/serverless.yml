service: u-1744227146460-omega

package:
  exclude:
    - venv/**
    - src/**

# Configuration
custom:
  # Get environment from env or default to dev
  stage: ${env:ENVIRONMENT, 'dev'}

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${env:ENVIRONMENT, 'dev'}
  environment: ${file(env.json)}

plugins:
  - serverless-plugin-typescript

functions:
  calculateAndSendLeaderboard:
    handler: dist/index.calculateAndSendLeaderboard
    events:
      - http:
          path: /leaderboard/calculate
          method: post
          cors: true

  getLeaderboard:
    handler: dist/index.getLeaderboard
    events:
      - http:
          path: /leaderboard
          method: get
          cors: true

  scheduledLeaderboardUpdate:
    handler: dist/index.scheduledLeaderboardUpdate
    events:
      - schedule:
          rate: cron(0 0 * * ? *)
          input:
            environment: ${env:ENVIRONMENT, 'dev'}
            source: scheduled-job
      # HTTP endpoint for testing in all environments
      - http:
          path: /cron/leaderboard-update
          method: post
          cors: true

  # Documentation
  getDocs:
    handler: dist/index.getDocs
    events:
      - http:
          path: /docs.json
          method: get
          cors: true

# Resources for API Gateway
resources:
  Outputs:
    ApiEndpoints:
      Description: "API Endpoints"
      Value:
        Fn::Join:
          - ""
          - - "API: https://"
            - Ref: "ApiGatewayRestApi"
            - ".execute-api."
            - Ref: "AWS::Region"
            - ".amazonaws.com/${env:ENVIRONMENT, 'dev'}"